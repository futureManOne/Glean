name: Release Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run unit tests
        run: bun run test

      - name: Typecheck
        run: bun run compile

      - name: Build Chrome & Firefox packages
        run: |
          bun run zip
          bun run zip:firefox

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Glean (拾句) ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            .output/glean-*.zip
